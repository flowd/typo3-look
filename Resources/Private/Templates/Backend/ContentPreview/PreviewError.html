<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Content Preview</title>
        <meta http-equiv="Content-Security-Policy" content="{csp}" />
        <link rel="stylesheet" href="{css}" />
        <script defer nonce="{nonce}" src="{lookScript}"></script>
        <f:if condition="{expired}">
            <f:comment>tells the page module to fetch a fresh token and reload this frame (see ContentPreviewHost.js)</f:comment>
            <script nonce="{nonce}">window.parent !== window && window.parent.postMessage({ type: 'flowd-look-content-preview-expired' }, '*');</script>
        </f:if>
    </head>
    <body style="--preview-scale: 1">
        <div class="look-preview-error">
            <strong>Preview could not be rendered</strong>
            <p>{message}</p>
        </div>
    </body>
</html>
