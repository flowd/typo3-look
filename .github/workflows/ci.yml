name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        typo3: ['^13.4', '^14.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies for TYPO3 ${{ matrix.typo3 }}
        run: >
          composer update --no-interaction --no-progress --with-all-dependencies
          --with "typo3/cms-core:${{ matrix.typo3 }}"
          --with "typo3/cms-backend:${{ matrix.typo3 }}"
          --with "typo3/cms-fluid:${{ matrix.typo3 }}"
          --with "typo3/cms-frontend:${{ matrix.typo3 }}"

      - name: Code style (PHP-CS-Fixer)
        run: composer check:php:cs-fixer

      # static analysis and Rector run against the newest core only; the extension code adapts to
      # TYPO3 13 at runtime (method_exists/class_exists), which PHPStan cannot follow across versions
      - name: Static analysis (PHPStan)
        if: matrix.typo3 == '^14.3'
        run: composer check:php:phpstan

      - name: Rector
        if: matrix.typo3 == '^14.3'
        run: composer check:php:rector

      - name: Unit tests
        run: composer check:tests:unit
