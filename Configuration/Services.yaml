services:
    _defaults:
        autoconfigure: true
        autowire: true
    Flowd\Typo3Look\:
        resource: '../Classes/*'
        # value objects, not services
        exclude:
            - '../Classes/Asset/IsolatedRendering.php'
            - '../Classes/Preview/InvalidPreviewTokenException.php'
            - '../Classes/Preview/PreviewDescriptor.php'
            - '../Classes/Rendering/PageTypoScriptResult.php'
